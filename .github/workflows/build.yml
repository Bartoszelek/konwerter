name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk konwerter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Konwerter-apk
          path: konwerter.apk
      - name: Publish release (aktualizacje w aplikacji)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Konwerter 1.${{ github.run_number }}
          files: konwerter.apk
          make_latest: true
